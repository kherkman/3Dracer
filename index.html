<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Autokisarata — proseduraalinen 3D-generaattori</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#cdd9c6; font-family:'Segoe UI', system-ui, sans-serif; touch-action:none; }
  canvas { display:block; touch-action:none; }

  #ui {
    position:fixed; top:18px; left:18px; z-index:10;
    color:#2a2f22; width:340px; max-height:90vh; overflow-y:auto;
    background:rgba(255,255,255,0.82);
    backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,255,0.7);
    border-radius:14px;
    padding:16px;
    box-shadow:0 8px 24px rgba(30,30,20,0.2);
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }
  #ui h1 { font-size:1.1rem; font-weight:700; margin-bottom:10px; color:#33301f; }
  #ui p { font-size:0.78rem; line-height:1.35; color:#40402c; opacity:0.85; margin-bottom:10px; }

  /* TIE- JA KISANAPIT IKKUNAN ALUSSA */
  .ui-buttons-grid {
    display:grid; grid-template-columns: 1fr 1fr; gap:6px; margin-bottom:12px;
  }
  .btn {
    background:rgba(255,255,255,0.85); backdrop-filter: blur(8px);
    border:1px solid rgba(255,255,255,0.9); color:#33301f; font-size:0.78rem; font-weight:600;
    padding:10px 6px; border-radius:8px; cursor:pointer; transition: all 0.15s ease;
    box-shadow:0 3px 10px rgba(30,30,20,0.12); text-align:center;
    touch-action: manipulation;
  }
  .btn:hover { background:rgba(255,255,255,1); transform:translateY(-1px); }
  .btn:active { transform:translateY(0px) scale(0.97); }
  .btn.active { background:#d4611f; color:#fff; }
  .btn.race { background:#28a745; color:#fff; border-color:#28a745; grid-column: span 2; font-size:0.85rem; padding:11px; }
  .btn.race:hover { background:#218838; }
  .btn.players-btn { background:#0066cc; color:#fff; border-color:#0052a3; grid-column: span 2; font-size:0.82rem; }
  .btn.players-btn:hover { background:#0052a3; }

  .setting-row {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:8px; font-size:0.8rem; font-weight:600; color:#2a2f22;
  }
  .setting-row label { display:flex; align-items:center; gap:6px; }
  .setting-row input[type="number"] {
    width:54px; padding:6px 6px; border-radius:6px;
    border:1px solid rgba(0,0,0,0.2); background:rgba(255,255,255,0.9);
    font-size:0.85rem; font-weight:700; text-align:center; color:#2a2f22;
    touch-action: manipulation; user-select:text; -webkit-user-select:text;
  }
  .setting-row input[type="range"] {
    width:100px; cursor:pointer; touch-action: manipulation;
  }

  /* STEREO VR SÄÄTIMET */
  #stereoControls {
    display:none; margin-top:8px; padding-top:8px; border-top:1px solid rgba(0,0,0,0.12);
  }

  /* PELAAJIEN MUOKKAUSMODAALI */
  #playerModal {
    display:none; position:fixed; inset:0; z-index:600;
    background:rgba(0,0,0,0.65); backdrop-filter: blur(8px);
    align-items:center; justify-content:center; padding:16px;
  }
  .modal-content {
    background:#ffffff; border-radius:16px; width:100%; max-width:960px;
    max-height:90vh; overflow-y:auto; padding:20px;
    box-shadow:0 12px 32px rgba(0,0,0,0.4); display:flex; flex-direction:column; gap:16px;
  }
  .modal-header {
    display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid #eee; padding-bottom:10px;
  }
  .modal-header h2 { font-size:1.2rem; color:#33301f; }
  .modal-close-btn {
    background:#e03e3e; color:#fff; border:none; border-radius:50%;
    width:32px; height:32px; font-weight:bold; cursor:pointer; font-size:1rem;
  }

  .players-cards-container {
    display:grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap:14px; width:100%;
  }
  .player-card {
    background:#f8f9fa; border:1px solid #e2e8f0; border-radius:12px;
    padding:12px; display:flex; flex-direction:column; gap:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.05);
  }
  .player-card-header { font-weight:700; font-size:0.9rem; color:#1a202c; display:flex; align-items:center; gap:6px; }
  
  .car-preview-box {
    width:100%; height:130px; background:#1e293b; border-radius:8px;
    overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center;
  }
  .car-preview-box canvas { display:block !important; width:100% !important; height:100% !important; }

  .ctrl-group { display:flex; flex-direction:column; gap:3px; font-size:0.75rem; font-weight:600; color:#4a5568; }
  .ctrl-group label { display:flex; align-items:center; gap:4px; }
  
  .player-name-input, .ctrl-select, .car-tex-select {
    width:100%; padding:6px 8px; border-radius:6px; border:1px solid #cbd5e1;
    background:#fff; font-size:0.78rem; font-weight:600; color:#1e293b; outline:none;
    touch-action: manipulation; user-select:text; -webkit-user-select:text;
  }
  .player-name-input:focus, .ctrl-select:focus, .car-tex-select:focus { border-color:#d4611f; }

  .color-picker-row {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .car-color-picker {
    -webkit-appearance:none; border:none; width:42px; height:30px;
    border-radius:6px; cursor:pointer; background:none;
  }
  .car-color-picker::-webkit-color-swatch-wrapper { padding:0; }
  .car-color-picker::-webkit-color-swatch { border:1px solid #ccc; border-radius:6px; }

  #btPairBtn {
    margin-top:4px; width:100%; background:#0066cc; color:#fff;
    border:none; padding:10px 12px; border-radius:8px; font-size:0.78rem;
    font-weight:700; cursor:pointer; transition: background 0.15s ease;
    touch-action: manipulation;
  }
  #btPairBtn:hover { background:#0052a3; }

  /* KISAN LOPETUS X-NAPPI */
  #exitRaceBtn {
    display:none; position:fixed; top:12px; left:12px; z-index:300;
    width:44px; height:44px; border-radius:50%;
    background:rgba(212,36,25,0.9); color:#fff; font-size:1.4rem; font-weight:bold;
    border:2px solid #fff; cursor:pointer; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.3); transition: transform 0.15s ease;
    touch-action: manipulation;
  }
  #exitRaceBtn:hover { transform: scale(1.1); background:#b81b11; }

  /* YLÄPALKKI: SIJOITUSJÄRJESTYS */
  #leaderboardBar {
    display:none; position:fixed; top:0; left:50%; transform:translateX(-50%);
    z-index:200; background:rgba(20,22,18,0.75); backdrop-filter: blur(8px);
    padding:6px 18px; border-radius:0 0 12px 12px; color:#fff;
    font-size:0.8rem; font-weight:700; border:1px solid rgba(255,255,255,0.25);
    border-top:none; box-shadow:0 4px 16px rgba(0,0,0,0.3);
    gap:14px; align-items:center; white-space:nowrap;
  }
  .lb-item { display:flex; align-items:center; gap:5px; }
  .lb-badge { width:10px; height:10px; border-radius:50%; display:inline-block; border:1px solid #fff; }

  /* PELAAJAKOHTAISET HUD-IKKUNAT */
  .player-hud-box {
    position:fixed; z-index:150; display:none;
    background:rgba(255,255,255,0.82); backdrop-filter: blur(8px);
    border:1px solid rgba(255,255,255,0.85); border-radius:10px;
    padding:8px 12px; box-shadow:0 4px 14px rgba(0,0,0,0.2);
    color:#2a2f22; font-size:0.75rem; width:175px;
  }
  .player-hud-box h3 { font-size:0.82rem; font-weight:700; margin-bottom:3px; }
  .hud-row { display:flex; justify-content:space-between; margin-top:2px; }
  .hud-val { font-weight:700; font-family:Consolas, monospace; }

  /* KOSKETUSNÄYTÖN VIRTUAALINAPIT */
  .touch-controls-container {
    position:fixed; z-index:250; display:none;
    pointer-events:none; touch-action:none;
  }
  .touch-btn-group-left {
    position:absolute; bottom:14px; left:14px;
    display:flex; gap:10px; pointer-events:auto;
  }
  .touch-btn-group-right {
    position:absolute; bottom:14px; right:14px;
    display:flex; gap:10px; pointer-events:auto;
  }
  .touch-btn {
    width:56px; height:56px; border-radius:50%;
    background:rgba(255,255,255,0.5); backdrop-filter: blur(8px);
    border:2px solid rgba(255,255,255,0.85); color:#111;
    font-size:1.4rem; font-weight:bold; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.3); touch-action:none; cursor:pointer;
  }
  .touch-btn.active {
    background:rgba(212,97,31,0.9) !important; color:#fff !important; transform:scale(0.92);
  }
  .touch-btn.gas { background:rgba(40,167,69,0.65); border-color:#28a745; color:#fff; }
  .touch-btn.brake { background:rgba(220,53,69,0.65); border-color:#dc3545; color:#fff; }

  /* JAKOVIIVAT JAKO-RUUDULLA */
  .grid-divider { display:none; position:fixed; background:#111; z-index:100; box-shadow:0 0 8px rgba(0,0,0,0.6); }
  #dividerH { top:50%; left:0; width:100%; height:4px; transform:translateY(-50%); }
  #dividerV { top:0; left:50%; width:4px; height:100%; transform:translateX(-50%); }
  #dividerVTop { top:0; left:50%; width:4px; height:50%; transform:translateX(-50%); }

  /* LÄHTÖLASKENNAN OVERLAY */
  #countdownOverlay {
    position:fixed; inset:0; z-index:500;
    display:none; align-items:center; justify-content:center;
    font-size:8rem; font-weight:900; color:#ffffff;
    text-shadow:0 10px 30px rgba(0,0,0,0.7), 0 0 20px rgba(0,0,0,0.5);
    pointer-events:none; font-family:'Segoe UI', system-ui, sans-serif;
  }
  .countdown-pop { animation: popAnim 0.85s ease-out forwards; }
  @keyframes popAnim {
    0% { transform: scale(1.8); opacity: 0; }
    25% { transform: scale(1.0); opacity: 1; }
    75% { transform: scale(0.95); opacity: 1; }
    100% { transform: scale(0.6); opacity: 0; }
  }

  #loading {
    position:fixed; inset:0; background:#cdd9c6; z-index:1000;
    display:flex; align-items:center; justify-content:center;
    color:#33301f; font-size:1rem; letter-spacing:0.5px; transition: opacity 0.6s ease;
  }
  #errorBox {
    position:fixed; top:18px; right:18px; z-index:2000; max-width:360px;
    background:rgba(255,235,235,0.95); border:1px solid #e08a8a; color:#7a1f1f;
    padding:14px 16px; border-radius:10px; font-size:0.8rem; line-height:1.4; display:none;
  }
</style>
</head>
<body>

<div id="loading">🏁 Rakennetaan rataa…</div>
<div id="errorBox"></div>

<button id="exitRaceBtn" title="Lopeta kisa">✕</button>
<div id="leaderboardBar"></div>

<div id="countdownOverlay">3</div>
<div id="dividerH" class="grid-divider"></div>
<div id="dividerV" class="grid-divider"></div>
<div id="dividerVTop" class="grid-divider"></div>

<!-- PELAAJA-HUDIT -->
<div id="hudP1" class="player-hud-box"></div>
<div id="hudP2" class="player-hud-box"></div>
<div id="hudP3" class="player-hud-box"></div>
<div id="hudP4" class="player-hud-box"></div>

<!-- KOSKETUSNÄYTÖN OHJAIN-OVERLAYT -->
<div id="touchP1" class="touch-controls-container">
  <div class="touch-btn-group-left">
    <div class="touch-btn btn-left">◀</div>
    <div class="touch-btn btn-right">▶</div>
  </div>
  <div class="touch-btn-group-right">
    <div class="touch-btn btn-brake brake">🛑</div>
    <div class="touch-btn btn-gas gas">⚡</div>
  </div>
</div>

<div id="touchP2" class="touch-controls-container">
  <div class="touch-btn-group-left">
    <div class="touch-btn btn-left">◀</div>
    <div class="touch-btn btn-right">▶</div>
  </div>
  <div class="touch-btn-group-right">
    <div class="touch-btn btn-brake brake">🛑</div>
    <div class="touch-btn btn-gas gas">⚡</div>
  </div>
</div>

<div id="touchP3" class="touch-controls-container">
  <div class="touch-btn-group-left">
    <div class="touch-btn btn-left">◀</div>
    <div class="touch-btn btn-right">▶</div>
  </div>
  <div class="touch-btn-group-right">
    <div class="touch-btn btn-brake brake">🛑</div>
    <div class="touch-btn btn-gas gas">⚡</div>
  </div>
</div>

<div id="touchP4" class="touch-controls-container">
  <div class="touch-btn-group-left">
    <div class="touch-btn btn-left">◀</div>
    <div class="touch-btn btn-right">▶</div>
  </div>
  <div class="touch-btn-group-right">
    <div class="touch-btn btn-brake brake">🛑</div>
    <div class="touch-btn btn-gas gas">⚡</div>
  </div>
</div>

<!-- PELAAJIEN MUOKKAUSMODAALI -->
<div id="playerModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>🎮 Pelaajien ja autojen asetukset</h2>
      <button class="modal-close-btn" id="closeModalBtn">✕</button>
    </div>
    <div class="players-cards-container" id="modalCardsContainer"></div>
    <button id="btPairBtn">📶 Yhdistä Bluetooth-laite (Web BT)</button>
  </div>
</div>

<div id="ui">
  <h1>🏁 Autokisaradan generaattori</h1>

  <div class="ui-buttons-grid">
    <button class="btn race" id="raceBtn">🏎️ Aloita kisa</button>
    <button class="btn players-btn" id="openPlayersModalBtn">🎮 Pelaajat & Autot</button>
    <button class="btn" id="regenBtn">🔄 Uusi rata</button>
    <button class="btn" id="flyBtn">📷 Ajolinja</button>
    <button class="btn" id="rotateBtn">↻ Kierto</button>
    <button class="btn active" id="treesBtn">🌲 Metsä</button>
    <button class="btn active" id="curbBtn">🚧 Reunat</button>
    <button class="btn active" id="texturesBtn">🖼️ Tekstuurit On</button>
    <button class="btn active" id="waterBtn">🌊 Vesi On</button>
    <button class="btn" id="rainBtn">🌧️ Sade Off</button>
    <button class="btn" id="cloudsBtn">☁️ Pilvet Off</button>
    <button class="btn" id="stereoBtn" style="grid-column: span 2;">🥽 3D Stereo</button>
  </div>

  <div id="stereoControls">
    <div class="setting-row">
      <label for="eyeDistSlider">👁️ Silmäväli (IPD):</label>
      <input type="range" id="eyeDistSlider" min="0.01" max="0.80" step="0.01" value="0.15">
      <span id="eyeDistVal" class="hud-val">0.15m</span>
    </div>
    <div class="setting-row">
      <label for="imgOffsetSlider">↔️ Kuvan siirtymä:</label>
      <input type="range" id="imgOffsetSlider" min="-60" max="60" step="1" value="0">
      <span id="imgOffsetVal" class="hud-val">0px</span>
    </div>
  </div>

  <div class="setting-row">
    <label for="musicSelect">🎵 Taustamusiikki:</label>
    <select id="musicSelect" class="ctrl-select" style="width:130px;"></select>
  </div>

  <div class="setting-row">
    <label for="musicVolSlider">🔊 Musiikin voimakkuus:</label>
    <input type="range" id="musicVolSlider" min="0" max="1" step="0.05" value="0.5">
    <span id="musicVolVal" class="hud-val">50%</span>
  </div>

  <div class="setting-row">
    <label for="fxVolSlider">🔊 FX Äänet:</label>
    <input type="range" id="fxVolSlider" min="0" max="1" step="0.05" value="0.7">
    <span id="fxVolVal" class="hud-val">70%</span>
  </div>

  <div class="setting-row">
    <label for="timeSelect">⏰ Vuorokaudenaika:</label>
    <select id="timeSelect" class="ctrl-select" style="width:130px;">
      <option value="paiva" selected>☀️ Päivä</option>
      <option value="yo">🌙 Yö</option>
    </select>
  </div>

  <div class="setting-row">
    <label for="seasonSelect">🍂 Vuodenaika:</label>
    <select id="seasonSelect" class="ctrl-select" style="width:130px;">
      <option value="kesa" selected>🌿 Kesä</option>
      <option value="syksy">🍂 Syksy</option>
      <option value="talvi">❄️ Talvi</option>
      <option value="kevat">🌱 Kevät</option>
    </select>
  </div>

  <div class="setting-row">
    <label for="envSelect">🌲 Ympäristö:</label>
    <select id="envSelect" class="ctrl-select" style="width:130px;">
      <option value="simple" selected>Simple (Perus)</option>
      <option value="palmu">🌴 Palmu</option>
      <option value="kuusi">🌲 Kuusi</option>
      <option value="koivu">🌿 Koivu</option>
    </select>
  </div>

  <div class="setting-row">
    <label for="numCompetitors">🏁 Kilpailijat (1-8):</label>
    <input type="number" id="numCompetitors" min="1" max="8" value="2">
  </div>
  <div class="setting-row">
    <label for="numPlayers">🎮 Pelaajat (1-4):</label>
    <input type="number" id="numPlayers" min="1" max="4" value="1">
  </div>
  <div class="setting-row">
    <label for="numLaps">🔄 Kierrokset (1-20):</label>
    <input type="number" id="numLaps" min="1" max="20" value="3">
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
  if (typeof THREE === 'undefined') {
    document.write('<script src="https://unpkg.com/three@0.149.0/build/three.min.js"><\/script>');
  }

<script>
window.addEventListener('error', function(e){
  var box = document.getElementById('errorBox');
  box.style.display = 'block';
  box.textContent = '⚠️ Virhe: ' + (e.message || e) + ' — tarkista tiedostot ja internetyhteys.';
});

(function(){

/* ---------------------------------------------------------------
   TAUSTAMUSIIKKI (HELPPOSTI LISÄTTÄVÄ TAULUKKO)
--------------------------------------------------------------- */
var MUSIC_TRACKS = [
  { name: 'Musiikki Off', url: '' },
  { name: '🎵 Musiikki 1', url: 'music1.mp3' },
  { name: '🎵 Musiikki 2', url: 'music2.mp3' },
  { name: '🎵 Musiikki 3', url: 'music3.mp3' },
  { name: '🎵 Musiikki 4', url: 'music4.mp3' },
  { name: '🎵 Musiikki 5', url: 'music5.mp3' }
];

var currentMusicAudio = null;
var musicVolume = 0.5;
var musicPlayed = false;

var musicSelect = document.getElementById('musicSelect');
MUSIC_TRACKS.forEach(function(track, idx) {
  var opt = document.createElement('option');
  opt.value = idx;
  opt.textContent = track.name;
  if(idx === 1) opt.selected = true; // Oletuksena musiikki 1
  musicSelect.appendChild(opt);
});

function playSelectedMusic(index) {
  if (currentMusicAudio) {
    currentMusicAudio.pause();
    currentMusicAudio = null;
  }
  var track = MUSIC_TRACKS[index];
  if (!track || !track.url) return;

  currentMusicAudio = new Audio(track.url);
  currentMusicAudio.loop = true;
  currentMusicAudio.volume = musicVolume;
  currentMusicAudio.play().then(function(){
    musicPlayed = true;
  }).catch(function(err){});
}

function tryPlayMusic() {
  if (!musicPlayed && musicSelect.value > 0) {
    playSelectedMusic(parseInt(musicSelect.value));
  }
}

window.addEventListener('pointerdown', tryPlayMusic, { once: true });

musicSelect.addEventListener('change', function(e){
  playSelectedMusic(parseInt(e.target.value));
});

var musicVolSlider = document.getElementById('musicVolSlider');
var musicVolVal = document.getElementById('musicVolVal');
musicVolSlider.addEventListener('input', function(e){
  musicVolume = parseFloat(e.target.value);
  if (currentMusicAudio) currentMusicAudio.volume = musicVolume;
  musicVolVal.innerText = Math.round(musicVolume * 100) + "%";
  tryPlayMusic();
});

/* ---------------------------------------------------------------
   FX ÄÄNIEFEKTIT
--------------------------------------------------------------- */
var fxVolume = 0.7;
var fxVolSlider = document.getElementById('fxVolSlider');
var fxVolVal = document.getElementById('fxVolVal');

fxVolSlider.addEventListener('input', function(e){
  fxVolume = parseFloat(e.target.value);
  fxVolVal.innerText = Math.round(fxVolume * 100) + "%";
});

var FX_FILES = {
  splash: 'splash.mp3',
  sand: 'sand.mp3',
  collision: 'collision.mp3',
  beep: 'beep.mp3',
  go: 'go.mp3',
  finish: 'finish.mp3'
};

var lastFxTimes = {};

function playFX(fxKey) {
  if (fxVolume <= 0 || !FX_FILES[fxKey]) return;

  // Estetään täysin samaa ääntä päällekkäin liian tiheään (max 100ms välein)
  var now = performance.now();
  if (lastFxTimes[fxKey] && now - lastFxTimes[fxKey] < 100) return;
  lastFxTimes[fxKey] = now;

  var audio = new Audio(FX_FILES[fxKey]);
  audio.volume = fxVolume;
  audio.play().catch(function(){});
}

/* ---------------------------------------------------------------
   GLOBAALIT MUUTTUJAT JA TILA
--------------------------------------------------------------- */
var texturesEnabled = true;
var waterEnabled = true;
var isRain = false;
var isClouds = false;
var currentTimeOfDay = 'paiva';
var currentSeason = 'kesa';
var currentEnvironment = 'simple';

var ENV_TEXTURE_PATHS = {
  grass: 'nurmikko.jpg',
  asphalt: 'asfaltti.jpg',
  gravel: 'hiekka.jpg',
  foliage: 'kuusenpiikit.jpg',
  trunk: 'kuusenrunko.jpg'
};

var CAR_TEXTURE_PATHS = [
  { name: 'Ei tekstiiliä / Perus', url: '' },

var textureLoader = new THREE.TextureLoader();
var loadedTexturesCache = {};

function createProceduralFallbackTex(colorHex, label) {
  var c = document.createElement('canvas'); c.width = 128; c.height = 128;
  var ctx = c.getContext('2d');
  ctx.fillStyle = colorHex || '#888888'; ctx.fillRect(0,0,128,128);
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  for(var i=0; i<100; i++) ctx.fillRect(Math.random()*128, Math.random()*128, 2, 2);
  if(label) {
    ctx.fillStyle = '#ffffff'; ctx.font = '12px sans-serif'; ctx.textAlign='center';
    ctx.fillText(label, 64, 64);
  }
  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function loadTextureWithFallback(url, repeatX, repeatY, fallbackColor, label) {
  if (!url) return null;
  if (loadedTexturesCache[url]) return loadedTexturesCache[url];

  var tex = textureLoader.load(
    url,
    function(t) {
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      if (repeatX && repeatY) t.repeat.set(repeatX, repeatY);
      t.needsUpdate = true;
    },
    undefined,
    function() {
      var fb = createProceduralFallbackTex(fallbackColor, label || 'JPG');
      if (repeatX && repeatY) fb.repeat.set(repeatX, repeatY);
      tex.image = fb.image;
      tex.needsUpdate = true;
    }
  );
  loadedTexturesCache[url] = tex;
  return tex;
}

function concatFloat32(arrays) {
  var total = 0;
  for (var i=0;i<arrays.length;i++) total += arrays[i].length;
  var result = new Float32Array(total);
  var offset = 0;
  for (var i=0;i<arrays.length;i++) { result.set(arrays[i], offset); offset += arrays[i].length; }
  return result;
}
function mergeGeometries(geometries) {
  var positions = [], normals = [], uvs = [];
  for (var i=0;i<geometries.length;i++) {
    var g = geometries[i];
    var ng = g.index ? g.toNonIndexed() : g;
    positions.push(ng.attributes.position.array);
    normals.push(ng.attributes.normal.array);
    if (ng.attributes.uv) uvs.push(ng.attributes.uv.array);
  }
  var merged = new THREE.BufferGeometry();
  merged.setAttribute('position', new THREE.BufferAttribute(concatFloat32(positions), 3));
  merged.setAttribute('normal', new THREE.BufferAttribute(concatFloat32(normals), 3));
  if (uvs.length === geometries.length) {
    merged.setAttribute('uv', new THREE.BufferAttribute(concatFloat32(uvs), 2));
  }
  return merged;
}
function mergeGeometriesWithColors(parts) {
  var positions = [], normals = [], colors = [];
  for (var i=0;i<parts.length;i++) {
    var g = parts[i].geo;
    var ng = g.index ? g.toNonIndexed() : g;
    positions.push(ng.attributes.position.array);
    normals.push(ng.attributes.normal.array);
    var count = ng.attributes.position.count;
    var carr = new Float32Array(count*3);
    for (var k=0;k<count;k++) { carr[k*3]=parts[i].color[0]; carr[k*3+1]=parts[i].color[1]; carr[k*3+2]=parts[i].color[2]; }
    colors.push(carr);
  }
  var merged = new THREE.BufferGeometry();
  merged.setAttribute('position', new THREE.BufferAttribute(concatFloat32(positions), 3));
  merged.setAttribute('normal', new THREE.BufferAttribute(concatFloat32(normals), 3));
  merged.setAttribute('color', new THREE.BufferAttribute(concatFloat32(colors), 3));
  return merged;
}
function lerp(a,b,t){ return a+(b-a)*t; }
function lerp3(a,b,t){ return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)]; }
function smoothstep(e0,e1,x){ var t=Math.min(1,Math.max(0,(x-e0)/(e1-e0))); return t*t*(3-2*t); }

function formatTime(sec) {
  if (sec === null || sec === undefined || isNaN(sec)) return "--:--.-";
  var m = Math.floor(sec / 60);

  var ms = Math.floor((sec % 1) * 10);
  var mStr = m < 10 ? "0" + m : "" + m;
  var sStr = s < 10 ? "0" + s : "" + s;
  return mStr + ":" + sStr + "." + ms;
}

var controls = (function(){
  var target = new THREE.Vector3(0, 6, 0);
  var spherical = new THREE.Spherical();
  var startOffset = new THREE.Vector3().copy(camera.position).sub(target);
  spherical.setFromVector3(startOffset);
  var targetSpherical = spherical.clone();

  var minDistance = 8, maxDistance = 400;
  var minPhi = 0.06, maxPhi = Math.PI/2 - 0.02;

  var dragging = false, prevX = 0, prevY = 0;
  var dom = renderer.domElement;
  dom.style.touchAction = 'none';

  dom.addEventListener('pointerdown', function(e){
    if (isRacing) return;
    dragging = true; prevX = e.clientX; prevY = e.clientY;
    dom.setPointerCapture(e.pointerId);
  });
  dom.addEventListener('pointerup', function(){ dragging = false; });
  dom.addEventListener('pointercancel', function(){ dragging = false; });
  dom.addEventListener('pointermove', function(e){
    if (!dragging || isRacing) return;
    var dx = e.clientX - prevX, dy = e.clientY - prevY;
    prevX = e.clientX; prevY = e.clientY;
    targetSpherical.theta -= dx * 0.006;
    targetSpherical.phi -= dy * 0.006;
    targetSpherical.phi = Math.max(minPhi, Math.min(maxPhi, targetSpherical.phi));
  });
  dom.addEventListener('wheel', function(e){
    if (isRacing) return;
    e.preventDefault();
    targetSpherical.radius *= (1 + e.deltaY * 0.001);
    targetSpherical.radius = Math.max(minDistance, Math.min(maxDistance, targetSpherical.radius));
  }, { passive:false });

  return {
    target: target,
    autoRotate: false,
    autoRotateSpeed: 0.7,
    update: function(delta){
      if (this.autoRotate) targetSpherical.theta += this.autoRotateSpeed * delta * 0.3;
      spherical.theta += (targetSpherical.theta - spherical.theta) * 0.12;
      spherical.phi += (targetSpherical.phi - spherical.phi) * 0.12;
      spherical.radius += (targetSpherical.radius - spherical.radius) * 0.12;
      var offset = new THREE.Vector3().setFromSpherical(spherical);
      camera.position.copy(target).add(offset);
      camera.lookAt(target);
    },
    setDistance: function(d){
      d = Math.max(minDistance, Math.min(maxDistance, d));
      spherical.radius = d; targetSpherical.radius = d;
    }
  };
})();

var noiseSeed = 0;
var currentHillAmp = 8;
function hash2(x,y){
  var s = Math.sin(x*127.1 + y*311.7 + noiseSeed*0.013) * 43758.5453123;
  return s - Math.floor(s);
}
function smoothNoise(x,y){
  var xi=Math.floor(x), yi=Math.floor(y);
  var xf=x-xi, yf=y-yi;
  var v00=hash2(xi,yi), v10=hash2(xi+1,yi), v01=hash2(xi,yi+1), v11=hash2(xi+1,yi+1);
  var u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return v00+(v10-v00)*u + (v01-v00)*v + (v00-v10-v01+v11)*u*v;
}
function fbm(x,y,octaves){
  var total=0, amp=0.5, freq=1, maxAmp=0;
  for(var i=0;i<octaves;i++){
    total += smoothNoise(x*freq, y*freq)*amp;
    maxAmp += amp; amp*=0.5; freq*=2.05;
  }
  return total/maxAmp;
}
function rawHeightAt(x,z){
  var h1 = fbm(x*0.011, z*0.011, 4);
  var h2 = fbm(x*0.045+50, z*0.045+50, 3);
  return (h1*0.75 + h2*0.25) * currentHillAmp;
}

    var u = i/n;
    var p = curveBase.getPointAt(u);
    var t = curveBase.getTangentAt(u);
    var normal = new THREE.Vector3(-t.z, 0, t.x).normalize();
    var lateral = Math.sin(u*Math.PI*2*freq1+phase1)*amp1 + Math.sin(u*Math.PI*2*freq2+phase2)*amp2;
    p.addScaledVector(normal, lateral);
    rawPoints.push(p);
  }

  var curveWiggly = new THREE.CatmullRomCurve3(rawPoints, true, 'catmullrom', 0.5);

  var samples = [];
  for(var i=0; i<n; i++){
    var u = i/n;
    var p = curveWiggly.getPointAt(u);
    var t = curveWiggly.getTangentAt(u).normalize();
    samples.push({ x:p.x, z:p.z, tx:t.x, tz:t.z, y:0, bank:0, dist:0, surface:0 });
  }

  var cum = 0;
  for(var i=0; i<n; i++){
    var j = (i+1)%n;
    var dx = samples[j].x - samples[i].x, dz = samples[j].z - samples[i].z;
    samples[i].segLen = Math.sqrt(dx*dx + dz*dz);
    samples[i].dist = cum;
    cum += samples[i].segLen;
  }
  var totalLength = cum;

  for(var i=0; i<n; i++) samples[i].rawY = rawHeightAt(samples[i].x, samples[i].z);
  var win = 5;
  for(var i=0; i<n; i++){
    var sum = 0;
    for(var k=-win; k<=win; k++){
      sum += samples[(i+k+n)%n].rawY;
    }
    samples[i].y = sum / (win*2+1);
  }

  var maxSlope = 0.08;
  for(var pass=0; pass<30; pass++){
    for(var i=0; i<n; i++){
      var j = (i+1)%n;
      var seg = samples[i].segLen;
      var diff = samples[j].y - samples[i].y;
      var maxDiff = maxSlope * seg;
      if(diff > maxDiff){
        var mid = (samples[i].y + samples[j].y)/2;
        samples[i].y = mid - maxDiff/2;
        samples[j].y = mid + maxDiff/2;
      } else if(diff < -maxDiff){
        var mid2 = (samples[i].y + samples[j].y)/2;
        samples[i].y = mid2 + maxDiff/2;
        samples[j].y = mid2 - maxDiff/2;
      }
    }
  }

  var bankRaw = new Array(n);
  for(var i=0; i<n; i++){
    var prev = samples[(i-1+n)%n];
    var a1 = Math.atan2(samples[i].tz, samples[i].tx);
    var a0 = Math.atan2(prev.tz, prev.tx);
    var da = a1 - a0;
    while(da > Math.PI) da -= Math.PI*2;
    while(da < -Math.PI) da += Math.PI*2;
    bankRaw[i] = THREE.MathUtils.clamp(da * 2.5, -0.28, 0.28);
  }
  for(var i=0; i<n; i++){
    var sum = 0;
    for(var k=-4; k<=4; k++) sum += bankRaw[(i+k+n)%n];
    samples[i].bank = sum / 9;
  }

  var idx = 0, type = Math.random()<0.5?0:1;
  while(idx < n){
    var runLen = 14 + Math.floor(Math.random()*22);
    for(var k=0; k<runLen && idx<n; k++, idx++) samples[idx].surface = type;
    type = 1 - type;
  }

  var trackPoints3D = [];
  for(var i=0; i<n; i++){
    trackPoints3D.push(new THREE.Vector3(samples[i].x, samples[i].y + ROAD_ELEVATION, samples[i].z));
  }
  var trackCurve3D = new THREE.CatmullRomCurve3(trackPoints3D, true, 'catmullrom', 0.5);

  return { samples:samples, n:n, totalLength:totalLength, curve3D:trackCurve3D };
}

function closestSampleInfo(track, x, z){
  var samples = track.samples, n = track.n;
  var best = Infinity, bi = 0;
  for(var i=0;i<n;i++){
    var dx = x-samples[i].x, dz = z-samples[i].z;
    var d2 = dx*dx+dz*dz;
    if(d2<best){ best=d2; bi=i; }
  }
  
  var s = samples[bi];
  var perpX = -s.tz, perpZ = s.tx;
  var dx = x - s.x, dz = z - s.z;
  var latDist = dx * perpX + dz * perpZ;

  return { dist: Math.sqrt(best), sample: s, sampleIndex: bi, latDist: latDist };
}

function terrainSample(track, x, z){
  var info = closestSampleInfo(track, x, z);
  var raw = rawHeightAt(x, z);
  var d = info.dist;
  var y, zoneT;

  if(d < SHOULDER_END){
    y = info.sample.y - 0.25;
    zoneT = 0;
  } else {
    var t = smoothstep(SHOULDER_END, BLEND_END, d);
    y = lerp(info.sample.y - 0.25, raw, t);
    zoneT = t;
  }
  var shoulder = [0.34,0.28,0.19];
  var patch = smoothNoise(x*0.05+50, z*0.05+50);

  var grassA, grassB;
  if (currentSeason === 'kesa') {
    grassA = [0.20,0.38,0.13]; grassB = [0.30,0.47,0.19];
  } else if (currentSeason === 'syksy') {
    grassA = [0.42,0.35,0.15]; grassB = [0.55,0.42,0.18];
  } else if (currentSeason === 'talvi') {
    grassA = [0.85,0.90,0.92]; grassB = [0.92,0.95,0.97];
  } else {
    grassA = [0.32,0.52,0.18]; grassB = [0.45,0.62,0.22];
  }

  var grass = lerp3(grassA, grassB, patch);
  var heightT = THREE.MathUtils.clamp(raw/(currentHillAmp||10), 0, 1);
  var rock = (currentSeason === 'talvi') ? [0.8,0.85,0.9] : [0.52,0.50,0.46];
  var grassOrRock = lerp3(grass, rock, smoothstep(0.6, 0.95, heightT));
  var col = lerp3(shoulder, grassOrRock, zoneT);
  return { y:y, color:col };
}

function getRoadSurfaceHeight(track, x, z){
  var info = closestSampleInfo(track, x, z);
  var s = info.sample;
  var bankOffset = Math.sin(s.bank) * info.latDist;
  return s.y + ROAD_ELEVATION + bankOffset;
}

function makeCheckeredTexture() {
  var c = document.createElement('canvas'); c.width = 128; c.height = 32;
  var ctx = c.getContext('2d');
  var cols = 8, rows = 2;
  var w = c.width / cols, h = c.height / rows;
  for (var r = 0; r < rows; r++) {
    for (var col = 0; col < cols; col++) {
      ctx.fillStyle = (r + col) % 2 === 0 ? '#ffffff' : '#111111';
      ctx.fillRect(col * w, r * h, w, h);
    }
  }
  var tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

function makeBannerTexture() {
  var c = document.createElement('canvas'); c.width = 512; c.height = 128;
  var ctx = c.getContext('2d');
  ctx.fillStyle = '#e62419'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 10; ctx.strokeRect(6, 6, c.width-12, c.height-12);
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 50px "Segoe UI", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

function buildFinishLine(track) {
  var group = new THREE.Group();
  var s0 = track.samples[0];
  var tangent = new THREE.Vector3(s0.tx, 0, s0.tz).normalize();
  var perp = new THREE.Vector3(-s0.tz, 0, s0.tx).normalize();

  var L = 2.4;
  var W = ROAD_HALF_WIDTH;

  var backCenter = new THREE.Vector3(s0.x, 0, s0.z).addScaledVector(tangent, -L / 2);
  var frontCenter = new THREE.Vector3(s0.x, 0, s0.z).addScaledVector(tangent, L / 2);

  var blX = backCenter.x + perp.x * W, blZ = backCenter.z + perp.z * W;
  var blY = getRoadSurfaceHeight(track, blX, blZ) + 0.04;

  var brX = backCenter.x - perp.x * W, brZ = backCenter.z - perp.z * W;
  var brY = getRoadSurfaceHeight(track, brX, brZ) + 0.04;

  var flX = frontCenter.x + perp.x * W, flZ = frontCenter.z + perp.z * W;
  var flY = getRoadSurfaceHeight(track, flX, flZ) + 0.04;

  var frX = frontCenter.x - perp.x * W, frZ = frontCenter.z - perp.z * W;
  var frY = getRoadSurfaceHeight(track, frX, frZ) + 0.04;

  var positions = new Float32Array([
    blX, blY, blZ,
    brX, brY, brZ,
    flX, flY, flZ,
    frX, frY, frZ
  ]);

  var uvs = new Float32Array([
    0, 0,
    1, 0,
    0, 1,
    1, 1
  ]);

  var indices = [
    0, 2, 1,
    1, 2, 3
  ];

  var stripeGeo = new THREE.BufferGeometry();
  stripeGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  stripeGeo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  stripeGeo.setIndex(indices);
  stripeGeo.computeVertexNormals();

  var stripeMat = new THREE.MeshStandardMaterial({
    map: makeCheckeredTexture(),
    roughness: 0.5,
    side: THREE.DoubleSide,
    polygonOffset: true,
    polygonOffsetFactor: -4,
    polygonOffsetUnits: -4
  });

  var stripe = new THREE.Mesh(stripeGeo, stripeMat);
  stripe.receiveShadow = true;
  group.add(stripe);

  var postMat = new THREE.MeshStandardMaterial({ color: 0x333336, roughness: 0.4, metalness: 0.6 });
  var postGeo = new THREE.CylinderGeometry(0.18, 0.22, 5.5, 12);
  postGeo.translate(0, 2.75, 0);

  var leftX = s0.x + perp.x * (ROAD_HALF_WIDTH + 0.8);
  var leftZ = s0.z + perp.z * (ROAD_HALF_WIDTH + 0.8);
  var leftY = getRoadSurfaceHeight(track, leftX, leftZ);

  var rightX = s0.x - perp.x * (ROAD_HALF_WIDTH + 0.8);
  var rightZ = s0.z - perp.z * (ROAD_HALF_WIDTH + 0.8);
  var rightY = getRoadSurfaceHeight(track, rightX, rightZ);

  var leftPost = new THREE.Mesh(postGeo, postMat);
  leftPost.position.set(leftX, leftY, leftZ);
  leftPost.castShadow = true;
  group.add(leftPost);

  var rightPost = new THREE.Mesh(postGeo, postMat);
  rightPost.position.set(rightX, rightY, rightZ);
  rightPost.castShadow = true;
  group.add(rightPost);

  var bannerGeo = new THREE.BoxGeometry(ROAD_HALF_WIDTH * 2 + 1.6, 1.2, 0.3);
  var bannerTex = makeBannerTexture();
  var bannerMat = [
    postMat, postMat, postMat, postMat,
    new THREE.MeshStandardMaterial({ map: bannerTex, roughness: 0.4 }),
    new THREE.MeshStandardMaterial({ map: bannerTex, roughness: 0.4 })
  ];
  var banner = new THREE.Mesh(bannerGeo, bannerMat);
  var angle = Math.atan2(s0.tx, s0.tz);
  var topCenterY = (leftY + rightY) / 2 + 4.8;
  banner.position.set(s0.x, topCenterY, s0.z);
  banner.rotation.y = angle;
  banner.castShadow = true;
  group.add(banner);

  return group;
}

var puddlesList = [];
var waterGroup = new THREE.Group();
scene.add(waterGroup);

function buildPuddles(track) {
  puddlesList = [];
  while(waterGroup.children.length > 0){
    var obj = waterGroup.children[0];
    if(obj.geometry) obj.geometry.dispose();
    waterGroup.remove(obj);
  }

  if (!waterEnabled) return;

  var minY = Infinity, maxY = -Infinity;
  for (var i = 0; i < track.n; i++) {
    var y = track.samples[i].y;
    if (y < minY) minY = y;
    if (y > maxY) maxY = y;
  }

  var waterLevel = minY + (maxY - minY) * 0.28;
  var pMat = new THREE.MeshStandardMaterial({
    color: 0x3a6073,
    roughness: 0.05,
    metalness: 0.9,
    transparent: true,
    opacity: 0.8,
    side: THREE.DoubleSide
  });

  for (var i = 10; i < track.n - 10; i += 18) {
    var s = track.samples[i];
    if (s.y < waterLevel) {
      var rx = ROAD_HALF_WIDTH * 0.75;
      var rz = 3.0 + Math.random() * 2.5;
      var circleGeo = new THREE.CircleGeometry(rx, 16);
      circleGeo.rotateX(-Math.PI / 2);
      circleGeo.scale(1, 1, rz / rx);

      var pMesh = new THREE.Mesh(circleGeo, pMat);
      var py = getRoadSurfaceHeight(track, s.x, s.z) + 0.03;
      pMesh.position.set(s.x, py, s.z);
      var angle = Math.atan2(s.tx, s.tz);
      pMesh.rotation.y = angle;

      waterGroup.add(pMesh);
      puddlesList.push({ x: s.x, z: s.z, radius: rx * 1.2 });
    }
  }
}

function spawnSplashParticles(x, y, z, count) {
  playFX('splash');
  for (var i = 0; i < count; i++) {
    var mesh = new THREE.Mesh(splashGeo, splashMat);
    mesh.position.set(x + (Math.random()-0.5)*0.8, y + 0.1, z + (Math.random()-0.5)*0.8);
    var vx = (Math.random() - 0.5) * 3.5;
    var vy = 2.0 + Math.random() * 3.0;
    var vz = (Math.random() - 0.5) * 3.5;
    scene.add(mesh);
    splashParticles.push({ mesh: mesh, vx: vx, vy: vy, vz: vz, life: 0.4 + Math.random()*0.3 });
  }
}

function updateSplashParticles(delta) {
  for (var i = splashParticles.length - 1; i >= 0; i--) {
    var p = splashParticles[i];
    p.life -= delta;
    if (p.life <= 0) {
      scene.remove(p.mesh);
      splashParticles.splice(i, 1);
    } else {
      p.vy -= 9.8 * delta;
      p.mesh.position.x += p.vx * delta;
      p.mesh.position.y += p.vy * delta;
      p.mesh.position.z += p.vz * delta;
      var s = p.life * 2.0;
      p.mesh.scale.set(s, s, s);
    }
  }
}

function buildTerrain(track){
  var minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
  for(var i=0;i<track.n;i++){
    var s=track.samples[i];
    if(s.x<minX)minX=s.x; if(s.x>maxX)maxX=s.x;
    if(s.z<minZ)minZ=s.z; if(s.z>maxZ)maxZ=s.z;
  }
  var cx=(minX+maxX)/2, cz=(minZ+maxZ)/2;
  var size=Math.max(maxX-minX, maxZ-minZ)+140;
  var segs=112;
  var geo=new THREE.PlaneGeometry(size,size,segs,segs);
  geo.rotateX(-Math.PI/2);
  geo.translate(cx,0,cz);
  var posAttr=geo.attributes.position;
  var colors=new Float32Array(posAttr.count*3);
  for(var i=0;i<posAttr.count;i++){
    var x=posAttr.getX(i), z=posAttr.getZ(i);
    var ts=terrainSample(track,x,z);
    posAttr.setY(i, ts.y);
    colors[i*3]=ts.color[0]; colors[i*3+1]=ts.color[1]; colors[i*3+2]=ts.color[2];
  }
  posAttr.needsUpdate=true;
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  geo.computeVertexNormals();

  var terrainTex = texturesEnabled ? loadTextureWithFallback(ENV_TEXTURE_PATHS.grass, size/6, size/6, '#3a6628', 'NURMIKKO') : null;
  var mat=new THREE.MeshStandardMaterial({
    vertexColors:true,
    map: terrainTex,
    roughness:1, metalness:0
  });
  var mesh=new THREE.Mesh(geo, mat);
  mesh.receiveShadow=true;
  return { mesh:mesh, bounds:{ minX:minX,maxX:maxX,minZ:minZ,maxZ:maxZ,cx:cx,cz:cz,size:size } };
}

function buildRoad(track){
  var n=track.n, samples=track.samples;
  var positions=[], uvs=[];
  for(var i=0;i<n;i++){
    var s=samples[i];
    var perp=new THREE.Vector3(-s.tz,0,s.tx).normalize();
    var bankOffset=Math.sin(s.bank)*ROAD_HALF_WIDTH;
    var baseSurfaceY = s.y + ROAD_ELEVATION;
    var leftY=baseSurfaceY+bankOffset;
    var rightY=baseSurfaceY-bankOffset;
    var lx=s.x+perp.x*ROAD_HALF_WIDTH, lz=s.z+perp.z*ROAD_HALF_WIDTH;
    var rx=s.x-perp.x*ROAD_HALF_WIDTH, rz=s.z-perp.z*ROAD_HALF_WIDTH;
    positions.push(lx,leftY,lz, rx,rightY,rz);
    var v=s.dist/4.0;
    uvs.push(0,v, 1,v);
  }
  var geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions),3));
  geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvs),2));

  var asphaltIdx=[], gravelIdx=[];
  for(var i=0;i<n;i++){
    var j=(i+1)%n;
    var a=2*i, b=2*i+1, c=2*j, d=2*j+1;
    var target = samples[i].surface===0 ? asphaltIdx : gravelIdx;
    target.push(a,b,d, a,d,c);
  }
  var indices=asphaltIdx.concat(gravelIdx);
  geo.setIndex(indices);
  geo.addGroup(0, asphaltIdx.length, 0);
  geo.addGroup(asphaltIdx.length, gravelIdx.length, 1);
  geo.computeVertexNormals();

  var asphaltTex = texturesEnabled ? loadTextureWithFallback(ENV_TEXTURE_PATHS.asphalt, 1, 30, '#333333', 'ASFALTTI') : makeAsphaltProceduralTex();
  var gravelTex = texturesEnabled ? loadTextureWithFallback(ENV_TEXTURE_PATHS.gravel, 1, 30, '#8f7350', 'HIEKKA') : makeGravelProceduralTex();

  var asphaltMat=new THREE.MeshStandardMaterial({ map:asphaltTex, roughness:0.92, metalness:0.05, side:THREE.DoubleSide });
  var gravelMat=new THREE.MeshStandardMaterial({ map:gravelTex, roughness:1.0, side:THREE.DoubleSide });
  var mesh=new THREE.Mesh(geo, [asphaltMat, gravelMat]);
  mesh.receiveShadow=true;
  return mesh;
}

function buildCurbs(track){
  var n=track.n, samples=track.samples;
  var positions=[], colors=[], indices=[];
  var blockLen=4.0;
  function addSide(sideSign){
    var vertsStart = positions.length/3;
    for(var i=0;i<n;i++){
      var s=samples[i];
      var perp=new THREE.Vector3(-s.tz,0,s.tx).normalize();
      var bankOffset=Math.sin(s.bank)*ROAD_HALF_WIDTH;
      var edgeY = s.y + ROAD_ELEVATION + sideSign*bankOffset;
      var innerR=ROAD_HALF_WIDTH;
      var midR=ROAD_HALF_WIDTH+CURB_WIDTH*0.55;
      var outerR=ROAD_HALF_WIDTH+CURB_WIDTH;
      var ix=s.x+perp.x*innerR*sideSign, iz=s.z+perp.z*innerR*sideSign;
      var mx=s.x+perp.x*midR*sideSign, mz=s.z+perp.z*midR*sideSign;
      var ox=s.x+perp.x*outerR*sideSign, oz=s.z+perp.z*outerR*sideSign;
      var innerY=edgeY+0.02, midY=edgeY+0.22, outerY=edgeY+0.05;
      positions.push(ix,innerY,iz, mx,midY,mz, ox,outerY,oz);
      var block = Math.floor(s.dist/blockLen)%2;
      var col = block===0 ? [0.78,0.09,0.07] : [0.90,0.88,0.82];
      colors.push(col[0],col[1],col[2], col[0],col[1],col[2], col[0],col[1],col[2]);
    }
    for(var i=0;i<n;i++){
      var j=(i+1)%n;
      var base=vertsStart+i*3, base2=vertsStart+j*3;
      indices.push(base+0, base+1, base2+1, base+0, base2+1, base2+0);
      indices.push(base+1, base+2, base2+2, base+1, base2+2, base2+1);
    }
  }
  addSide(1); addSide(-1);
  var geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions),3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors),3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  var mat=new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.55, side:THREE.DoubleSide });
  var mesh=new THREE.Mesh(geo, mat);
  mesh.castShadow=true; mesh.receiveShadow=true;
  return mesh;
}

function buildDelineators(track){
  var n=track.n, samples=track.samples;
  var postGeo=new THREE.CylinderGeometry(0.06,0.08,0.8,6); postGeo.translate(0,0.4,0);
  var capGeo=new THREE.ConeGeometry(0.1,0.2,6); capGeo.translate(0,0.9,0);
  var merged=mergeGeometries([postGeo, capGeo]);
  var step=3;
  var list=[];
  for(var i=0;i<n;i+=step){
    var s=samples[i];
    var perp=new THREE.Vector3(-s.tz,0,s.tx).normalize();
    var side = (Math.floor(i/step)%2===0) ? 1 : -1;
    var r = ROAD_HALF_WIDTH+CURB_WIDTH+0.35;
    var x=s.x+perp.x*r*side, z=s.z+perp.z*r*side;
    var bankOffset=Math.sin(s.bank)*ROAD_HALF_WIDTH;
    var y=s.y+ROAD_ELEVATION+side*bankOffset;
    list.push({ x:x,y:y,z:z, block: Math.floor(s.dist/4.0)%2 });
  }
  var inst=new THREE.InstancedMesh(merged, new THREE.MeshStandardMaterial({ roughness:0.6 }), list.length);
  var m4=new THREE.Matrix4(), col=new THREE.Color(), q=new THREE.Quaternion();
  for(var i=0;i<list.length;i++){
    var p=list[i];
    m4.compose(new THREE.Vector3(p.x,p.y,p.z), q, new THREE.Vector3(1,1,1));
    inst.setMatrixAt(i, m4);
    if(p.block===0) col.setRGB(0.85,0.28,0.05); else col.setRGB(0.92,0.92,0.9);
    inst.setColorAt(i, col);
  }
  inst.instanceMatrix.needsUpdate=true;
  if(inst.instanceColor) inst.instanceColor.needsUpdate=true;
  inst.castShadow=true;
  return inst;
}

function makeSimpleTreeGeometry(){
  var trunk=new THREE.CylinderGeometry(0.05,0.09,1.0,5); trunk.translate(0,0.5,0);
  var f1=new THREE.ConeGeometry(0.62,1.1,7); f1.translate(0,1.15,0);
  var f2=new THREE.ConeGeometry(0.48,0.95,7); f2.translate(0,1.75,0);
  var f3=new THREE.ConeGeometry(0.32,0.8,7); f3.translate(0,2.35,0);

  var folCol1, folCol2, folCol3;
  if (currentSeason === 'kesa') {
    folCol1 = [0.13, 0.30, 0.14]; folCol2 = [0.15, 0.34, 0.16]; folCol3 = [0.18, 0.38, 0.18];
  } else if (currentSeason === 'syksy') {
    folCol1 = [0.45, 0.32, 0.12]; folCol2 = [0.52, 0.38, 0.14]; folCol3 = [0.60, 0.45, 0.16];
  } else if (currentSeason === 'talvi') {
    folCol1 = [0.75, 0.82, 0.85]; folCol2 = [0.80, 0.88, 0.90]; folCol3 = [0.88, 0.92, 0.95];
  } else {
    folCol1 = [0.22, 0.45, 0.18]; folCol2 = [0.26, 0.50, 0.20]; folCol3 = [0.30, 0.55, 0.22];
  }

  return mergeGeometriesWithColors([
    { geo:trunk, color:[0.30,0.20,0.12] },
    { geo:f1, color:folCol1 },
    { geo:f2, color:folCol2 },
    { geo:f3, color:folCol3 }
  ]);
}

function makePalmTreeGeometry() {
  var parts = [];
  var trunkSegs = 8;
  for (var i = 0; i < trunkSegs; i++) {
    var t = i / trunkSegs;
    var r = lerp(0.18, 0.09, t);
    var h = 0.5;
    var cGeo = new THREE.CylinderGeometry(r*0.9, r, h, 6);
    cGeo.translate(Math.sin(t*Math.PI*0.5)*0.3, i*0.48 + 0.25, 0);
    cGeo.rotateY(t*0.3);
    parts.push({ geo: cGeo, color: [0.38, 0.25, 0.14] });
  }

  var topY = trunkSegs * 0.48;
  var frondCount = 10;
  var leafCol = [0.15, 0.42, 0.12];
  if (currentSeason === 'syksy') leafCol = [0.55, 0.42, 0.12];
  else if (currentSeason === 'talvi') leafCol = [0.75, 0.80, 0.82];
  else if (currentSeason === 'kevat') leafCol = [0.25, 0.55, 0.15];

  for (var f = 0; f < frondCount; f++) {
    var angle = (f / frondCount) * Math.PI * 2;
    var frondGroupGeo = [];

    var leafStem = new THREE.BoxGeometry(0.04, 0.03, 1.8);
    leafStem.translate(0, 0, 0.9);
    leafStem.rotateX(-0.35 - (f % 2)*0.1);
    leafStem.rotateY(angle);
    leafStem.translate(Math.sin(0.5*Math.PI)*0.3, topY, 0);
    frondGroupGeo.push(leafStem);

    for (var l = 0; l < 6; l++) {
      var lt = l / 6;
      var leaflet = new THREE.BoxGeometry(0.45 * (1 - lt*0.5), 0.01, 0.12);
      leaflet.rotateZ((l % 2 === 0 ? 1 : -1) * 0.2);
      leaflet.translate(0, -lt*0.3, 0.3 + lt * 1.3);
      leaflet.rotateX(-0.35 - (f % 2)*0.1);
      leaflet.rotateY(angle);
      leaflet.translate(Math.sin(0.5*Math.PI)*0.3, topY, 0);
      frondGroupGeo.push(leaflet);
    }

    var mergedFrond = mergeGeometries(frondGroupGeo);
    parts.push({ geo: mergedFrond, color: leafCol });
  }

  for (var c = 0; c < 3; c++) {
    var nut = new THREE.DodecahedronGeometry(0.12, 0);
    var ca = c * 2.1;
    nut.translate(Math.cos(ca)*0.16 + 0.3, topY - 0.1, Math.sin(ca)*0.16);
    parts.push({ geo: nut, color: [0.28, 0.18, 0.08] });
  }

  return mergeGeometriesWithColors(parts);
}

function makeSpruceTreeGeometry() {
  var parts = [];
  var trunk = new THREE.CylinderGeometry(0.06, 0.16, 2.6, 6);
  trunk.translate(0, 1.3, 0);
  parts.push({ geo: trunk, color: [0.25, 0.18, 0.12] });

  var whorls = 7;
  for (var w = 0; w < whorls; w++) {
    var t = w / (whorls - 1);
    var y = lerp(0.5, 2.8, t);
    var radius = lerp(0.85, 0.15, t);
    var cone = new THREE.ConeGeometry(radius, 0.5, 8);
    cone.translate(0, y, 0);

    var cColor;
    if (currentSeason === 'kesa') {
      cColor = [0.11 + t*0.05, 0.30 + t*0.08, 0.15];
    } else if (currentSeason === 'syksy') {
      cColor = [0.38 + t*0.1, 0.32, 0.12];
    } else if (currentSeason === 'talvi') {
      cColor = [0.82, 0.88, 0.90];
    } else {
      cColor = [0.22, 0.48 + t*0.08, 0.18];
    }

    parts.push({ geo: cone, color: cColor });
  }

  return mergeGeometriesWithColors(parts);
}

function makeBirchTreeGeometry() {
  var parts = [];
  var trunk = new THREE.CylinderGeometry(0.06, 0.13, 2.4, 7);
  trunk.translate(0, 1.2, 0);
  parts.push({ geo: trunk, color: [0.88, 0.88, 0.82] });

  var baseKnots = new THREE.CylinderGeometry(0.135, 0.14, 0.5, 7);
  baseKnots.translate(0, 0.25, 0);
  parts.push({ geo: baseKnots, color: [0.15, 0.12, 0.10] });

  var branchCount = 6;
  var leafCol;
  if (currentSeason === 'kesa') {
    leafCol = [0.22, 0.52, 0.14];
  } else if (currentSeason === 'syksy') {
    leafCol = [0.85, 0.55, 0.08];
  } else if (currentSeason === 'talvi') {
    leafCol = [0.72, 0.78, 0.80];
  } else {
    leafCol = [0.45, 0.72, 0.20];
  }

  for (var b = 0; b < branchCount; b++) {
    var bt = b / branchCount;
    var by = 1.0 + bt * 1.5;
    var angle = b * 2.3;
    var bx = Math.cos(angle) * 0.35;
    var bz = Math.sin(angle) * 0.35;

    var bGeo = new THREE.CylinderGeometry(0.02, 0.04, 0.6, 5);
    bGeo.rotateZ(0.6);
    bGeo.rotateY(angle);
    bGeo.translate(bx*0.5, by, bz*0.5);
    parts.push({ geo: bGeo, color: [0.20, 0.16, 0.12] });

    var crown = new THREE.DodecahedronGeometry(0.35 + (1 - bt)*0.2, 1);
    crown.translate(bx*1.2, by + 0.2, bz*1.2);
    parts.push({ geo: crown, color: leafCol });
  }

  return mergeGeometriesWithColors(parts);
}

function buildForest(track, bounds){
  var treeGeo;
  if (currentEnvironment === 'palmu') {
    treeGeo = makePalmTreeGeometry();
  } else if (currentEnvironment === 'kuusi') {
    treeGeo = makeSpruceTreeGeometry();
  } else if (currentEnvironment === 'koivu') {
    treeGeo = makeBirchTreeGeometry();
  } else {
    treeGeo = makeSimpleTreeGeometry();
  }

  var desired = 550 + Math.floor(Math.random()*300);
  var maxAttempts = desired * 6;
  var accepted = [];
  var halfSize = bounds.size/2 * 0.92;
  var exclR = ROAD_HALF_WIDTH + CURB_WIDTH + 2.5;
  var attempts = 0;

  while(accepted.length < desired && attempts < maxAttempts){
    attempts++;
    var x = bounds.cx + (Math.random()*2 - 1)*halfSize;
    var z = bounds.cz + (Math.random()*2 - 1)*halfSize;
    var info = closestSampleInfo(track, x, z);
    if(info.dist < exclR) continue;
    accepted.push({ x:x, z:z });
  }

  var treeMat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.85 });

  var inst = new THREE.InstancedMesh(treeGeo, treeMat, accepted.length);
  var m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), col = new THREE.Color(), euler = new THREE.Euler();

  for(var i=0; i<accepted.length; i++){
    var p = accepted[i];
    var y = terrainSample(track, p.x, p.z).y;
    euler.set(0, Math.random()*Math.PI*2, 0);
    q.setFromEuler(euler);
    var s = 0.75 + Math.random()*0.9;
    m4.compose(new THREE.Vector3(p.x, y, p.z), q, new THREE.Vector3(s, s*(0.9+Math.random()*0.3), s));
    inst.setMatrixAt(i, m4);
    var tint = 0.88 + Math.random()*0.24;
    col.setRGB(tint, tint, tint);
    inst.setColorAt(i, col);
  }

  inst.instanceMatrix.needsUpdate = true;
  if(inst.instanceColor) inst.instanceColor.needsUpdate = true;
  inst.castShadow = true; inst.receiveShadow = true;
  return inst;
}

function buildCarMesh(bodyColorHex, accentColorHex, carTexUrl) {
  var carGroup = new THREE.Group();
  
  var bodyGeo = new THREE.BoxGeometry(1.7, 0.5, 3.4);
  bodyGeo.translate(0, 0.45, 0);
  
  var bodyMat = new THREE.MeshStandardMaterial({
    color: bodyColorHex,
    roughness: 0.3,
    metalness: 0.3
  });

  if (texturesEnabled && carTexUrl) {
    var carTex = loadTextureWithFallback(carTexUrl, 1, 1, bodyColorHex, 'AUTOTEX');
    if (carTex) bodyMat.map = carTex;
  }

  var bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
  bodyMesh.castShadow = true;
  carGroup.add(bodyMesh);

  var cabinGeo = new THREE.BoxGeometry(1.35, 0.5, 1.6);
  cabinGeo.translate(0, 0.88, -0.1);
  var cabinMat = new THREE.MeshStandardMaterial({ color: 0x111318, roughness: 0.1, metalness: 0.8 });
  var cabinMesh = new THREE.Mesh(cabinGeo, cabinMat);
  cabinMesh.castShadow = true;
  carGroup.add(cabinMesh);

  var spoilerGeo = new THREE.BoxGeometry(1.6, 0.08, 0.45);
  spoilerGeo.translate(0, 1.22, -1.5);
  var accentMat = new THREE.MeshStandardMaterial({ color: accentColorHex || 0x111111, roughness: 0.4 });
  var spoilerMesh = new THREE.Mesh(spoilerGeo, accentMat);
  spoilerMesh.castShadow = true;
  carGroup.add(spoilerMesh);

  var post1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.1), accentMat);
  post1.position.set(-0.55, 1.05, -1.5);
  var post2 = post1.clone(); post2.position.x = 0.55;
  carGroup.add(post1); carGroup.add(post2);

  var wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.25, 16);
  wheelGeo.rotateZ(Math.PI / 2);
  var wheelMat = new THREE.MeshStandardMaterial({ color: 0x222225, roughness: 0.8 });
  var wheelPos = [
    [-0.85, 0.32, 1.0], [0.85, 0.32, 1.0],
    [-0.85, 0.32, -1.0], [0.85, 0.32, -1.0]
  ];
  for(var i=0; i<4; i++){
    var wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.position.set(wheelPos[i][0], wheelPos[i][1], wheelPos[i][2]);
    wheel.castShadow = true;
    carGroup.add(wheel);
  }

  var headLightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  var hl1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.1), headLightMat);
  hl1.position.set(-0.5, 0.52, 1.71);
  var hl2 = hl1.clone(); hl2.position.x = 0.5;
  carGroup.add(hl1); carGroup.add(hl2);

  var spot1 = new THREE.SpotLight(0xfff5cc, 2.5, 45, Math.PI/6, 0.4);
  spot1.position.set(-0.5, 0.52, 1.75);
  spot1.target.position.set(-0.5, 0.1, 15);
  spot1.visible = (currentTimeOfDay === 'yo');
  carGroup.add(spot1); carGroup.add(spot1.target);

  var spot2 = new THREE.SpotLight(0xfff5cc, 2.5, 45, Math.PI/6, 0.4);
  spot2.position.set(0.5, 0.52, 1.75);
  spot2.target.position.set(0.5, 0.1, 15);
  spot2.visible = (currentTimeOfDay === 'yo');
  carGroup.add(spot2); carGroup.add(spot2.target);

  carGroup.userData.headlight1 = spot1;
  carGroup.userData.headlight2 = spot2;

  var tailLightMat = new THREE.MeshBasicMaterial({ color: 0xff1100 });
  var tl1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 0.1), tailLightMat);
  tl1.position.set(-0.5, 0.55, -1.71);
  var tl2 = tl1.clone(); tl2.position.x = 0.5;
  carGroup.add(tl1); carGroup.add(tl2);

  return carGroup;
}

function setupPreviewCanvas(playerIdx, cfg) {
  var box = document.getElementById('previewBox' + playerIdx);
  if (!box) return;

  var w = box.clientWidth || 220;
  var h = box.clientHeight || 130;

  var pScene = new THREE.Scene();
  pScene.background = new THREE.Color(0x1e293b);

  var pCam = new THREE.PerspectiveCamera(40, w / h, 0.1, 50);
  pCam.position.set(3.6, 2.2, 4.4);
  pCam.lookAt(0, 0.5, 0);

  var pLight = new THREE.DirectionalLight(0xffffff, 1.8);
  pLight.position.set(6, 10, 6);
  pScene.add(pLight);
  pScene.add(new THREE.AmbientLight(0xffffff, 0.8));

  var pRenderer = new THREE.WebGLRenderer({ antialias: true });
  pRenderer.setSize(w, h);
  pRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  box.appendChild(pRenderer.domElement);

  var carTexUrl = CAR_TEXTURE_PATHS[cfg.texIdx] ? CAR_TEXTURE_PATHS[cfg.texIdx].url : '';
  var carMesh = buildCarMesh(cfg.color, '#ffffff', carTexUrl);
  pScene.add(carMesh);

  var pData = {
    active: true,
    renderer: pRenderer,
    scene: pScene,
    camera: pCam,
    carMesh: carMesh,
    playerIdx: playerIdx,
    box: box
  };
  previewScenes.push(pData);
}

function updatePreviewMesh(pIdx) {
  var ps = previewScenes.find(function(p) { return p.playerIdx === pIdx; });
  if (!ps) return;
  ps.scene.remove(ps.carMesh);

  var cfg = playerConfigs[pIdx];
  var carTexUrl = CAR_TEXTURE_PATHS[cfg.texIdx] ? CAR_TEXTURE_PATHS[cfg.texIdx].url : '';
  ps.carMesh = buildCarMesh(cfg.color, '#ffffff', carTexUrl);
  ps.scene.add(ps.carMesh);
}

function renderPreviewsAnimation() {
  previewScenes.forEach(function(ps) {
    if (ps.active && ps.carMesh && ps.renderer) {
      if(ps.box && ps.box.clientWidth > 0 && ps.box.clientHeight > 0) {
        var bw = ps.box.clientWidth, bh = ps.box.clientHeight;
        if (ps.renderer.domElement.width !== bw || ps.renderer.domElement.height !== bh) {
          ps.renderer.setSize(bw, bh);
          ps.camera.aspect = bw / bh;
          ps.camera.updateProjectionMatrix();
        }
      }
      ps.carMesh.rotation.y += 0.015;
      ps.renderer.render(ps.scene, ps.camera);
    }
  });
}

function bindTouchBtn(btnEl, playerIdx, action) {
  function setAction(active, e) {
    if(e) e.preventDefault();
    touchInputState[playerIdx][action] = active;
    btnEl.classList.toggle('active', active);
  }
  btnEl.addEventListener('pointerdown', function(e){ setAction(true, e); try { btnEl.setPointerCapture(e.pointerId); } catch(err){} });
  btnEl.addEventListener('pointerup', function(e){ setAction(false, e); });
  btnEl.addEventListener('pointercancel', function(e){ setAction(false, e); });
  btnEl.addEventListener('pointerleave', function(e){ setAction(false, e); });
}

for(var i = 0; i < 4; i++) {

    bindTouchBtn(pContainer.querySelector('.btn-right'), i, 'right');
    bindTouchBtn(pContainer.querySelector('.btn-brake'), i, 'brake');
    bindTouchBtn(pContainer.querySelector('.btn-gas'), i, 'gas');
  }
}

function getGamepadInputs(gpIndex) {
  var gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  var gp = gamepads[gpIndex];
  if(!gp) return { gas:false, brake:false, left:false, right:false };

  var steerAxis = gp.axes[0] || 0;
  var gasButton = (gp.buttons[7] && gp.buttons[7].value > 0.1) || (gp.buttons[0] && gp.buttons[0].pressed);
  var brakeButton = (gp.buttons[6] && gp.buttons[6].value > 0.1) || (gp.buttons[1] && gp.buttons[1].pressed);

  var dLeft = gp.buttons[14] && gp.buttons[14].pressed;
  var dRight = gp.buttons[15] && gp.buttons[15].pressed;

  return {
    gas: !!gasButton,
    brake: !!brakeButton,
    left: steerAxis < -0.2 || dLeft,
    right: steerAxis > 0.2 || dRight
  };
}

function getPlayerControls(playerIndex) {
  var ctrlType = playerConfigs[playerIndex] ? playerConfigs[playerIndex].ctrl : 'keyboard';

  if(ctrlType === 'touch') {
    return touchInputState[playerIndex];
  } else if(ctrlType === 'keyboard') {
    if(playerIndex === 0) {
      if(numPlayers === 1) {
        return {
          gas: keysInput.p1.gas || keysInput.p2.gas,
          brake: keysInput.p1.brake || keysInput.p2.brake,
          left: keysInput.p1.left || keysInput.p2.left,
          right: keysInput.p1.right || keysInput.p2.right
        };
      }
      return keysInput.p1;
    }
    if(playerIndex === 1) return keysInput.p2;
    if(playerIndex === 2) return keysInput.p3;
    if(playerIndex === 3) return keysInput.p4;
  } else if(ctrlType.indexOf('gamepad') === 0) {
    var gpIdx = parseInt(ctrlType.replace('gamepad', '')) || 0;
    return getGamepadInputs(gpIdx);
  } else if(ctrlType === 'mouse') {
    return {
      gas: mouseState.leftDown,
      brake: mouseState.rightDown,
      left: mouseState.xNorm < -0.12,
      right: mouseState.xNorm > 0.12
    };
  } else if(ctrlType === 'bluetooth') {
    return getGamepadInputs(playerIndex);
  }

  return { gas:false, brake:false, left:false, right:false };
}

function createCars() {
  for(var i = 0; i < cars.length; i++) {
    if(cars[i].engineAudio) {
      cars[i].engineAudio.pause();
      cars[i].engineAudio = null;
    }
    if(cars[i].mesh) scene.remove(cars[i].mesh);
  }
  cars = [];

  var aiCounter = 1;

  var usedColors = playerConfigs.slice(0, numPlayers).map(function(c){ return c.color; });
  var usedTextures = playerConfigs.slice(0, numPlayers).map(function(c){ return c.texIdx; });

  var availColors = PRESET_PALETTES.filter(function(c){ return usedColors.indexOf(c) === -1; });
  if (availColors.length === 0) availColors = PRESET_PALETTES.slice();

  var availTextures = [];
  for (var t = 0; t < CAR_TEXTURE_PATHS.length; t++) {
    if (usedTextures.indexOf(t) === -1) availTextures.push(t);
  }
  if (availTextures.length === 0) availTextures = [0];

  for(var i = 0; i < numCompetitors; i++) {
    var isPlayerCar = (i < numPlayers);
    var carName = "", carColor = "", carTexIdx = 0;

    if(isPlayerCar) {
      var cfg = playerConfigs[i];
      carName = (cfg.name && cfg.name.trim() !== "") ? cfg.name.trim() : ("Pelaaja " + (i + 1));
      carColor = cfg.color;
      carTexIdx = cfg.texIdx;
    } else {
      carName = "Tietokone " + aiCounter;
      aiCounter++;
      carColor = availColors[(i - numPlayers) % availColors.length];
      carTexIdx = availTextures[(i - numPlayers) % availTextures.length];
    }

    var carTexUrl = CAR_TEXTURE_PATHS[carTexIdx] ? CAR_TEXTURE_PATHS[carTexIdx].url : '';
    var mesh = buildCarMesh(carColor, '#111111', carTexUrl);
    scene.add(mesh);

    var engineAudioObj = null;
    if (isPlayerCar) {
      engineAudioObj = new Audio('moottori.mp3');
      engineAudioObj.loop = true;
      engineAudioObj.volume = 0;
      engineAudioObj.playbackRate = 1.0;
    }

    cars.push({
      id: i,
      name: carName,
      colorHex: carColor,
      colorCss: carColor,
      isHuman: isPlayerCar,
      playerNum: isPlayerCar ? (i + 1) : 0,
      mesh: mesh,
      engineAudio: engineAudioObj,
      headlight1: mesh.userData.headlight1,
      headlight2: mesh.userData.headlight2,
      x: 0, y: 0, z: 0, angle: 0, speed: 0,
      progress: 0, prevProgress: 0, totalDist: 0,
      aiSpeed: 16.5 + Math.random() * 3.5,
      laps: 0, currentLapTime: 0, bestLapTime: null,
      lastSampleIdx: 0, passedMidpoint: false,
      finished: false, finishRank: 0
    });
  }
}

function clearCountdownTimeouts() {
  for(var i = 0; i < countdownTimeouts.length; i++) {
    clearTimeout(countdownTimeouts[i]);
  }
  countdownTimeouts = [];
}

function startCountdown() {
  var overlay = document.getElementById('countdownOverlay');
  overlay.style.display = 'flex';
  isCountdown = true;

  var steps = [
    { text: '3', color: '#ffc107', delay: 0, fx: 'beep' },
    { text: '2', color: '#ff9800', delay: 1000, fx: 'beep' },
    { text: '1', color: '#f44336', delay: 2000, fx: 'beep' },
    { text: 'GO!', color: '#28a745', delay: 3000, fx: 'go' }
  ];

  clearCountdownTimeouts();

  steps.forEach(function(s) {
    var t = setTimeout(function() {
      if (!isRacing) return;
      playFX(s.fx);
      overlay.textContent = s.text;
      overlay.style.color = s.color;
      overlay.classList.remove('countdown-pop');
      void overlay.offsetWidth;
      overlay.classList.add('countdown-pop');

      if (s.text === 'GO!') {
        isCountdown = false;
        cars.forEach(function(c) {
          if (c.engineAudio) {
            c.engineAudio.currentTime = 0;
            c.engineAudio.play().catch(function(){});
          }
        });
      }
    }, s.delay);
    countdownTimeouts.push(t);
  });

  var hideT = setTimeout(function() {
    overlay.style.display = 'none';
  }, 4000);
  countdownTimeouts.push(hideT);
}

function initRace(){
  if(!currentTrack) return;

  tryPlayMusic();
  finishCounter = 0;
  createCars();

  var s0 = currentTrack.samples[0];
  var s1 = currentTrack.samples[1];
  var dir = new THREE.Vector3(s1.x - s0.x, 0, s1.z - s0.z).normalize();
  var startAngle = Math.atan2(dir.x, dir.z);
  var perp = new THREE.Vector3(-dir.z, 0, dir.x);

  for(var i = 0; i < cars.length; i++) {
    var c = cars[i];
    var row = Math.floor(i / 2);
    var colSign = (i % 2 === 0) ? 1 : -1;

    var sampleOffsetIdx = (currentTrack.n - row * 7 + currentTrack.n) % currentTrack.n;
    var samplePoint = currentTrack.samples[sampleOffsetIdx];

    c.x = samplePoint.x + perp.x * (1.6 * colSign);
    c.z = samplePoint.z + perp.z * (1.6 * colSign);
    c.y = getRoadSurfaceHeight(currentTrack, c.x, c.z);
    c.angle = startAngle;
    c.speed = 0;
    c.progress = sampleOffsetIdx / currentTrack.n;
    c.prevProgress = c.progress;
    c.totalDist = 0;
    c.laps = 0;
    c.currentLapTime = 0;
    c.bestLapTime = null;
    c.lastSampleIdx = sampleOffsetIdx;
    c.passedMidpoint = false;
    c.finished = false;
    c.finishRank = 0;

    c.mesh.position.set(c.x, c.y, c.z);
    c.mesh.rotation.y = c.angle;
    c.mesh.visible = true;
  }

  isRacing = true;
  flyActive = false;
  controls.autoRotate = false;

  document.getElementById('rotateBtn').classList.remove('active');
  document.getElementById('flyBtn').classList.remove('active');
  document.getElementById('raceBtn').classList.add('active');

  document.getElementById('ui').style.display = 'none';

  document.getElementById('exitRaceBtn').style.display = 'flex';
  document.getElementById('leaderboardBar').style.display = 'flex';

  var dH = document.getElementById('dividerH');
  var dV = document.getElementById('dividerV');
  var dVTop = document.getElementById('dividerVTop');

  dH.style.display = (numPlayers >= 2) ? 'block' : 'none';
  dV.style.display = (numPlayers === 4) ? 'block' : 'none';
  dVTop.style.display = (numPlayers === 3) ? 'block' : 'none';

  positionHuds();
  positionTouchControls();
  updateHudUI();
  startCountdown();
}

function stopRace(){
  isRacing = false;
  isCountdown = false;
  clearCountdownTimeouts();

  document.getElementById('countdownOverlay').style.display = 'none';
  document.getElementById('dividerH').style.display = 'none';
  document.getElementById('dividerV').style.display = 'none';
  document.getElementById('dividerVTop').style.display = 'none';
  document.getElementById('exitRaceBtn').style.display = 'none';
  document.getElementById('leaderboardBar').style.display = 'none';

  document.getElementById('ui').style.display = 'block';

  for(var i = 0; i < cars.length; i++) {
    if(cars[i].engineAudio) {
      cars[i].engineAudio.pause();
      cars[i].engineAudio.currentTime = 0;
    }
    if(cars[i].mesh) cars[i].mesh.visible = false;
  }

  for(var i=0; i<4; i++) {
    touchInputState[i] = { gas:false, brake:false, left:false, right:false };
  }

  positionHuds();
  positionTouchControls();
  document.getElementById('raceBtn').classList.remove('active');

  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, innerWidth, innerHeight);
}

document.getElementById('exitRaceBtn').addEventListener('click', stopRace);

function updatePhysics(delta){
  if(!isRacing || !currentTrack) return;

  var n = currentTrack.n;

  if (isCountdown) {
    for(var i = 0; i < cars.length; i++) {
      var c = cars[i];
      c.mesh.position.set(c.x, c.y, c.z);
      c.mesh.rotation.y = c.angle;
      if (c.engineAudio) c.engineAudio.volume = 0;
    }
    updateCameras();
    return;
  }

  for(var i = 0; i < cars.length; i++) {
    var c = cars[i];

    if (c.finished) {
      if (c.engineAudio) c.engineAudio.volume = 0;
      continue;
    }

    if(c.isHuman) {
      var inp = getPlayerControls(i);
      var accel = 26.0, brake = 32.0, friction = 4.5, maxSpeed = 38.0;

      if(inp.gas) c.speed += accel * delta;
      else if(inp.brake) c.speed -= brake * delta;
      else {
        if(c.speed > 0) c.speed = Math.max(0, c.speed - friction * delta);
        else if(c.speed < 0) c.speed = Math.min(0, c.speed + friction * delta);
      }

      c.speed = THREE.MathUtils.clamp(c.speed, -12, maxSpeed);

      /* MOOTTORIÄÄNEN SÄVELKORKEUS JA SOITTO */
      if (c.engineAudio) {
        c.engineAudio.volume = fxVolume;
        if (inp.gas && c.speed > 0) {
          var speedRatio = Math.min(1.0, Math.max(0, c.speed / maxSpeed));
          c.engineAudio.playbackRate = 1.0 + speedRatio * 0.85;
        } else {
          c.engineAudio.playbackRate = 1.0;
        }
      }

      var turnSpeed = 2.3;
      if(Math.abs(c.speed) > 0.5) {
        var dirFactor = c.speed > 0 ? 1 : -1;
        if(inp.left) c.angle += turnSpeed * delta * dirFactor;
        if(inp.right) c.angle -= turnSpeed * delta * dirFactor;
      }

      var nextX = c.x + Math.sin(c.angle) * c.speed * delta;
      var nextZ = c.z + Math.cos(c.angle) * c.speed * delta;

      var trackInfo = closestSampleInfo(currentTrack, nextX, nextZ);
      var maxLatDistance = ROAD_HALF_WIDTH + CURB_WIDTH - 0.45;

      var isOnSand = (trackInfo.sample.surface === 1) || (Math.abs(trackInfo.latDist) > ROAD_HALF_WIDTH);
      if (isOnSand) {
        c.speed *= (1.0 - 0.16 * delta);
        if (Math.abs(c.speed) > 4.0) {
          if (Math.random() < 0.65) spawnDustParticles(nextX, c.y, nextZ, 2);
          if (Math.random() < 0.12) playFX('sand');
        }
      }

      if(Math.abs(trackInfo.latDist) > maxLatDistance) {
        var sign = trackInfo.latDist > 0 ? 1 : -1;
        var s = trackInfo.sample;
        var perpX = -s.tz, perpZ = s.tx;

        nextX = s.x + perpX * (maxLatDistance * sign);
        nextZ = s.z + perpZ * (maxLatDistance * sign);
        c.speed *= 0.6;
      }

      if (waterEnabled) {
        for (var p = 0; p < puddlesList.length; p++) {
          var pud = puddlesList[p];
          var pdx = nextX - pud.x, pdz = nextZ - pud.z;
          var pdist = Math.sqrt(pdx*pdx + pdz*pdz);
          if (pdist < pud.radius) {
            c.speed *= (1.0 - 0.22 * delta);
            if (Math.abs(c.speed) > 5.0 && Math.random() < 0.6) {
              spawnSplashParticles(nextX, c.y, nextZ, 3);
            }
            break;
          }
        }
      }

      c.x = nextX;
      c.z = nextZ;
      c.y = getRoadSurfaceHeight(currentTrack, c.x, c.z);

      c.mesh.position.set(c.x, c.y, c.z);
      c.mesh.rotation.y = c.angle;

      c.currentLapTime += delta;
      var currentSampleIdx = trackInfo.sampleIndex;

      if(currentSampleIdx > n * 0.4 && currentSampleIdx < n * 0.6) {
        c.passedMidpoint = true;
      }

      if(c.lastSampleIdx > n - 25 && currentSampleIdx < 25 && c.passedMidpoint) {
        c.laps++;
        if(c.bestLapTime === null || c.currentLapTime < c.bestLapTime) {
          c.bestLapTime = c.currentLapTime;
        }
        c.currentLapTime = 0;
        c.passedMidpoint = false;

        if(c.laps >= targetLaps) {
          c.finished = true;
          c.finishRank = ++finishCounter;
          c.mesh.visible = false;
          if (c.engineAudio) {
            c.engineAudio.pause();
          }
          playFX('finish');
          positionTouchControls();
        }
      }
      c.lastSampleIdx = currentSampleIdx;
      c.totalDist = c.laps * currentTrack.totalLength + (currentSampleIdx / n) * currentTrack.totalLength;

    } else {
      var trackLen = currentTrack.totalLength;
      c.progress += (c.aiSpeed * delta) / trackLen;
      if(c.progress > 1) c.progress -= 1;

      var aiPos = currentTrack.curve3D.getPointAt(c.progress);
      var aiLook = currentTrack.curve3D.getPointAt((c.progress + 0.005) % 1);

      var aiDir = new THREE.Vector3().subVectors(aiLook, aiPos).normalize();
      var aiPerp = new THREE.Vector3(-aiDir.z, 0, aiDir.x);
      
      var laneOffset = (c.id % 2 === 0 ? 1.5 : -1.5);
      aiPos.addScaledVector(aiPerp, laneOffset);

      c.x = aiPos.x;
      c.z = aiPos.z;
      c.y = getRoadSurfaceHeight(currentTrack, c.x, c.z);
      c.angle = Math.atan2(aiDir.x, aiDir.z);

      var aiTrackInfo = closestSampleInfo(currentTrack, c.x, c.z);
      if (aiTrackInfo.sample.surface === 1 && Math.random() < 0.4) {
        spawnDustParticles(c.x, c.y, c.z, 1);
      }

      if (waterEnabled) {
        for (var p = 0; p < puddlesList.length; p++) {
          var pud = puddlesList[p];
          var pdx = c.x - pud.x, pdz = c.z - pud.z;
          if (Math.sqrt(pdx*pdx + pdz*pdz) < pud.radius && Math.random() < 0.4) {
            spawnSplashParticles(c.x, c.y, c.z, 2);
            break;
          }
        }
      }

      c.mesh.position.set(c.x, c.y, c.z);
      c.mesh.lookAt(aiLook.x + aiPerp.x*laneOffset, c.y, aiLook.z + aiPerp.z*laneOffset);

      c.currentLapTime += delta;
      if(c.progress > 0.4 && c.progress < 0.6) {
        c.passedMidpoint = true;
      }
      if(c.prevProgress > 0.85 && c.progress < 0.15 && c.passedMidpoint) {
        c.laps++;
        if(c.bestLapTime === null || c.currentLapTime < c.bestLapTime) {
          c.bestLapTime = c.currentLapTime;
        }
        c.currentLapTime = 0;
        c.passedMidpoint = false;

        if(c.laps >= targetLaps) {
          c.finished = true;
          c.finishRank = ++finishCounter;
          c.mesh.visible = false;
          playFX('finish');
        }
      }
      c.prevProgress = c.progress;
      c.totalDist = c.laps * currentTrack.totalLength + c.progress * currentTrack.totalLength;
    }
  }

  // TÖRMÄYKSET
  for(var i = 0; i < cars.length; i++) {
    for(var j = i + 1; j < cars.length; j++) {
      var c1 = cars[i], c2 = cars[j];
      if(c1.finished || c2.finished) continue;

      var dx = c1.x - c2.x;
      var dz = c1.z - c2.z;
      var dist = Math.sqrt(dx*dx + dz*dz);
      var minDist = 2.2;

      if(dist < minDist && dist > 0.001) {
        var overlap = (minDist - dist) * 0.5;
        var nx = dx / dist, nz = dz / dist;

        if(c1.isHuman) {
          c1.x += nx * overlap; c1.z += nz * overlap; c1.speed *= 0.7;
        }
        if(c2.isHuman) {
          c2.x -= nx * overlap; c2.z -= nz * overlap; c2.speed *= 0.7;
        }
        playFX('collision');
      }
    }
  }

  updateSplashParticles(delta);
  updateDustParticles(delta);
  updatePrecipitation(delta);
  updateHudUI();
  updateCameras();
}

function updateCameras() {
  var camDist = 8.5, camHeight = 3.2;
  var cams = [camera, camera2, camera3, camera4];

  for(var i = 0; i < numPlayers; i++) {
    if(cars.length > i) {
      var p = cars[i];
      var cam = cams[i];

      var targetCamX = p.x - Math.sin(p.angle) * camDist;
      var targetCamZ = p.z - Math.cos(p.angle) * camDist;
      var targetCamY = p.y + camHeight;

      cam.position.x = lerp(cam.position.x, targetCamX, 0.12);
      cam.position.y = lerp(cam.position.y, targetCamY, 0.12);
      cam.position.z = lerp(cam.position.z, targetCamZ, 0.12);

      cam.lookAt(
        p.x + Math.sin(p.angle) * 4,
        p.y + 1.2,
        p.z + Math.cos(p.angle) * 4
      );
    }
  }
}

/* ---------------------------------------------------------------
   GENEROINTI JA HALLINTA
--------------------------------------------------------------- */
var currentTrack=null, terrainInfo=null;
var terrainMesh=null, roadMesh=null, curbMesh=null, postMesh=null, forestMesh=null, finishLineMesh=null;
var treesVisible=true, curbsVisible=true;

function disposeMesh(m){
  if(!m) return;
  if(m.geometry) m.geometry.dispose();
  scene.remove(m);
}

function regenerateAll(){
  stopRace();
  updateEnvironmentAtmosphere();
  buildClouds();

  noiseSeed = Math.random()*10000;
  currentHillAmp = 5.5 + Math.random()*6.5;

  disposeMesh(terrainMesh); disposeMesh(roadMesh); disposeMesh(curbMesh);
  disposeMesh(postMesh); disposeMesh(forestMesh); disposeMesh(finishLineMesh);

  var track = buildTrackPath();
  currentTrack = track;

  var terr = buildTerrain(track);
  terrainMesh = terr.mesh; terrainInfo = terr.bounds;
  scene.add(terrainMesh);

  roadMesh = buildRoad(track); scene.add(roadMesh);
  curbMesh = buildCurbs(track); scene.add(curbMesh);
  postMesh = buildDelineators(track); scene.add(postMesh);
  forestMesh = buildForest(track, terrainInfo); scene.add(forestMesh);
  finishLineMesh = buildFinishLine(track); scene.add(finishLineMesh);
  
  buildPuddles(track);

  curbMesh.visible = curbsVisible;
  postMesh.visible = curbsVisible;
  forestMesh.visible = treesVisible;

  var avgY=0;
  for(var i=0;i<track.n;i++) avgY += track.samples[i].y;
  avgY /= track.n;
  var midX=(terrainInfo.minX+terrainInfo.maxX)/2, midZ=(terrainInfo.minZ+terrainInfo.maxZ)/2;
  controls.target.set(midX, avgY+2, midZ);
  controls.setDistance(Math.max(60, terrainInfo.size*0.55));

  sun.target.position.set(midX, avgY, midZ);
  sun.position.set(midX+80, avgY+45, midZ+40);
}

});

});

var flyActive=false, flyT=0;
document.getElementById('flyBtn').addEventListener('click', function(e){
  if(isRacing) stopRace();
  flyActive=!flyActive;

   KÄYNNISTYS
--------------------------------------------------------------- */
regenerateAll();
setTimeout(function(){
  var l=document.getElementById('loading');
  l.style.opacity='0';
  setTimeout(function(){ l.remove(); }, 650);
